services:
  - type: web
    name: subai
    runtime: image
    image:
      url: docker.io/library/php:8.2-cli
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq libcurl4-openssl-dev libssl-dev unzip curl \
      && docker-php-ext-install curl \
      && mkdir -p uploads tmp \
      && chmod 777 uploads tmp
    startCommand: php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PHP_UPLOAD_MAX_FILESIZE
        value: 500M
      - key: PHP_POST_MAX_SIZE
        value: 510M
      - key: PHP_MAX_EXECUTION_TIME
        value: "600"
      - key: PHP_MEMORY_LIMIT
        value: 512M
    disk:
      name: subai-data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 2
